[build-system]
# setuptools-scm reads the release from the git tag at build time; a
# running clone reads git itself instead (ADR-0009).
requires = ["setuptools>=68", "setuptools-scm==8.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linghub"
dynamic = ["version"]
description = "Profile manager for the Logitech G502 family on Linux"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["dbus-fast>=5.2,<6"]

[project.optional-dependencies]
# The UI needs PyGObject, which is a system package on Fedora
# (python3-gobject) rather than something pip can install reliably.
ui = ["pygobject>=3.42", "pycairo>=1.20"]

[project.scripts]
linghub = "linghub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The diagram and the placed hotspots are read at runtime, so they must be in
# the wheel: a packaged install has no clone to find them in.
"linghub.ui" = ["hotspots.json", "images/*.png"]
[tool.setuptools_scm]
# Builds outside a clone (an sdist without git metadata) still get a version.
fallback_version = "0.0.0"
