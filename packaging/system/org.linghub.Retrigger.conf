<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the name: the helper runs as root. -->
  <policy user="root">
    <allow own="org.linghub.Retrigger"/>
  </policy>
  <!-- Any caller may send to it; the method itself is gated by polkit. -->
  <policy context="default">
    <allow send_destination="org.linghub.Retrigger"/>
  </policy>
</busconfig>
